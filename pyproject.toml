[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signalguard"
version = "0.1.0"
description = "CLI local para detectar señales anómalas desde Netdata y generar explicaciones breves."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27.0,<1.0.0",
  "rich>=13.7.0,<14.0.0",
  "typer>=0.12.3,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0,<9.0.0",
]

[project.scripts]
signalguard = "signalguard.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["signalguard*"]
